services:
  - type: web
    name: personal-ai-os-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: ai-gateway-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DB_PATH
        value: /var/data/ai-gateway.sqlite
      - key: JWT_SECRET
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://shirunjies8-png.github.io
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_TIMEOUT_MS
        value: 60000
      - key: DEEPSEEK_MAX_OUTPUT_TOKENS
        value: 1500
      - key: DEEPSEEK_MAX_RETRIES
        value: 1
      - key: DEEPSEEK_DAILY_REQUEST_LIMIT
        value: 100
      - key: DEEPSEEK_ENTERPRISE_DAILY_REQUEST_LIMIT
        value: 1000
      - key: DEEPSEEK_DAILY_TOKEN_LIMIT
        value: 200000
      - key: DEEPSEEK_DAILY_BUDGET
        value: 10
      - key: DEEPSEEK_MONTHLY_BUDGET
        value: 50
      - key: DEEPSEEK_SYSTEM_DAILY_TOKEN_LIMIT
        value: 1000000
      - key: DEEPSEEK_SYSTEM_DAILY_BUDGET
        value: 100
      - key: DEEPSEEK_SYSTEM_MONTHLY_BUDGET
        value: 250
      - key: DEEPSEEK_AGENT_DAILY_TOKEN_LIMIT
        value: 100000
      - key: DEEPSEEK_MAX_CONTEXT_TOKENS
        value: 64000
      - key: AI_IP_RATE_LIMIT
        value: 120
